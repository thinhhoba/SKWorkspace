services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/thinhhoba/skworkspace:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    networks:
      - sk-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sk-net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - sk-net

  # MinIO — object storage cho file dinh kem, hoa don, anh san pham
  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - sk-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy — phuc vu 3 subdomain + ACME challenge
  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - sk-net

  # Certbot — tu dong cap/renew chung chi Let's Encrypt
  # Mac dinh KHONG tu chay; can khoi dong thu cong lan dau:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d workspace.sonkhang.vn -d pos.sonkhang.vn -d dathang.sonkhang.vn \
  #     --email <email> --agree-tos --no-eff-email
  # Sau do reload nginx: docker compose exec nginx nginx -s reload
  # Renew dinh ky: docker compose run --rm certbot renew && docker compose exec nginx nginx -s reload
  # Hoac de cron tren host chay: 0 3 * * * docker compose -f /opt/sk-workspace/docker-compose.yml run --rm certbot renew && docker compose -f /opt/sk-workspace/docker-compose.yml exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Khong chay lien tuc — chi chay khi can (run --rm)
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    networks:
      - sk-net
    profiles:
      - certbot

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_www:
  certbot_certs:

networks:
  sk-net:
    driver: bridge
