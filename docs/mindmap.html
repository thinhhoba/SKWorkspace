<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EBF3FA">
<link rel="manifest" href="manifest.json">
<title>SK Workspace — Sơ đồ tư duy Modern Utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
*{font-family:'Inter',system-ui,sans-serif}.mono{font-family:'JetBrains Mono',monospace}
html[data-mu="light"]{--bg:#EBF3FA;--bg-grid:rgba(14,165,233,.04);--surface:#FFFFFF;--surface-2:#F1F5F9;--line:#D0E2F2;--ink:#0F172A;--muted:#64748B}
html[data-mu="dark"]{--bg:#0B1329;--bg-grid:rgba(6,182,214,.06);--surface:#0F1D3A;--surface-2:#030712;--line:rgba(255,255,255,.08);--ink:#F1F5F9;--muted:#94a3b8}
body{background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--bg-grid) 1px, transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px, transparent 1px);background-size:32px 32px}
*:focus-visible{outline:2px solid #0ea5e9;outline-offset:2px}
@media(max-width:1100px){#flow{grid-template-columns:1fr 1fr !important}}
@media(max-width:640px){#flow{grid-template-columns:1fr !important}}
@media print{
  body{background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  body::before{display:none !important}
  #frame{box-shadow:none !important}
  @page{size:A3 landscape;margin:10mm}
}
</style>
<script>
(function(){
  try{
    var s=localStorage.getItem('sk-mu');
    if(!s) s=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'light';
    document.documentElement.setAttribute('data-mu',s);
  }catch(e){document.documentElement.setAttribute('data-mu','light');}
})();
function syncThemeMeta(m){
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', m==='light' ? '#EBF3FA' : '#0B1329');
}
</script>
</head>
<body class="min-h-screen flex flex-col items-center py-5 px-3 gap-4">
<!-- GLOBAL HEADER -->
<div class="w-full max-w-[1360px] flex items-center justify-between gap-3 flex-wrap">
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2 bg-white rounded-full px-3 py-1.5 shadow border border-slate-200">
      <img src="assets/logo-sk-circle.png" alt="SK" class="w-6 h-6 rounded-full object-cover">
      <span class="text-xs font-extrabold tracking-widest text-slate-800">SK WORKSPACE</span>
      <span class="mono text-[10px] px-2 py-0.5 rounded-full bg-[#0B1329] text-white">MINDMAP</span>
    </div>
    <span class="hidden md:inline text-xs opacity-60">5 cột · Nguồn → Core Shell → 14 app → Đích</span>
  </div>
  <div class="flex items-center gap-2">
    <button id="btnLight" onclick="setMU('light')" class="px-4 py-2 rounded-full text-xs font-extrabold tracking-wide border bg-white text-slate-900 border-slate-200 shadow" aria-pressed="false">☀ LIGHT</button>
    <button id="btnDark" onclick="setMU('dark')" class="px-4 py-2 rounded-full text-xs font-extrabold tracking-wide border bg-white/10 text-white border-white/15" aria-pressed="false">◐ DARK COCKPIT</button>
    <div class="hidden lg:flex items-center gap-1.5 bg-white rounded-full p-1 border border-slate-200">
      <a href="ui-web.html" class="mono text-[11px] px-3 py-1.5 rounded-full hover:bg-slate-100">Web →</a>
      <a href="ui-pwa.html" class="mono text-[11px] px-3 py-1.5 rounded-full hover:bg-slate-100">PWA →</a>
      <button onclick="window.print()" class="mono text-[11px] px-3 py-1.5 rounded-full hover:bg-slate-100">⎙ In A3</button>
    </div>
  </div>
</div>

<!-- WINDOW -->
<div id="frame" class="w-full max-w-[1360px] rounded-[20px] overflow-hidden shadow-[0_24px_80px_rgba(0,0,0,.25)] border" style="background:var(--surface);border-color:var(--line)">
  <div id="topbar" class="h-[56px] flex items-center gap-3 px-4 border-b" style="background:var(--surface);border-color:var(--line)">
    <img src="assets/logo-sk-circle.png" alt="SK" id="topLogo" class="w-9 h-9 rounded-xl object-cover border" style="border-color:var(--line)">
    <div>
      <div id="topTitle" class="text-[13px] font-extrabold leading-none"></div>
      <div id="topSub" class="text-[11px]"></div>
    </div>
    <div class="flex-1"></div>
    <div id="pillArea" class="hidden sm:flex items-center gap-2"></div>
  </div>

  <div id="canvas" class="p-4 md:p-5" style="background:var(--bg)">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <h2 id="h2" class="text-[15px] font-extrabold flex items-center gap-2"></h2>
      <div id="legend" class="flex gap-2 flex-wrap mono text-[11px]"></div>
    </div>
    <p id="desc" class="text-sm mt-2 leading-relaxed opacity-70 max-w-4xl"></p>

    <!-- FLOW 4 COLS -->
    <div id="flow" class="mt-4 grid gap-3" style="grid-template-columns:1fr 1fr 1.7fr 1fr"></div>

    <!-- FOOT NOTES -->
    <div id="footGrid" class="mt-4 grid md:grid-cols-2 gap-3"></div>
  </div>
  <div id="foot" class="h-7 flex items-center justify-between px-4 mono text-[11px] border-t" style="border-color:var(--line)"></div>
</div>

<div class="w-full max-w-[1360px] text-center mono text-[11px] opacity-60">Modern Utility · In A3 Landscape — Ctrl/Cmd + P · print-color-adjust: exact</div>

<script>
const cols = [
  {k:'src', title:'1 · Nguồn vào', icon:'⬢', accent:'border-l-sky-500', nodes:[
    ['🛒 Sapo Omnichannel API','Đơn/KH/SP/tồn — pull & push 2 chiều'],
    ['📑 MISA AMIS','Excel 63 cột hiện tại → sau API trực tiếp'],
    ['🤖 InBot — HĐ đầu vào','Tự hút PDF/XML HĐĐT về MinIO'],
    ['🏛️ Tổng cục Thuế','Tra cứu HĐĐT, đối soát CQT'],
    ['🔍 Tra cứu MST','gdt.gov.vn — map KH theo MST'],
    ['💳 VietQR / Sepay / Casso','QR linh hoạt theo đơn/NCC'],
    ['👥 Vận hành & Nhân sự','Nhập tay, chấm công GPS, xe'],
    ['📅 Google Workspace','Drive/Calendar/Gmail 2 chiều'],
  ], note:'Tất cả qua adapter <code>packages/integrations/&lt;provider&gt;</code> — sync/push/pull/webhook + <b>external_id</b>'},
  {k:'core', title:'2 · Core Shell', icon:'⬣', accent:'border-l-violet-500', nodes:[
    ['WorkspaceRoot + HomePage','Grid 5×3 · filter · tìm kiếm · <code>#app/*</code>'],
    ['🔐 Auth & RBAC','Auth.js Google OAuth + allowlist <b>sonkhang.vn</b> → <code>hasAppAccess(appId)</code>'],
    ['🗄️ Data & Storage Layer','Postgres + Prisma + RLS · Redis + BullMQ · MinIO · DataStore truth'],
    ['🔄 SK Workflow Engine','If-This-Then-That: đơn mới / tồn thấp / nợ quá hạn → Task/Note'],
    ['🌐 Deploy 1 VPS','<code>docker compose up -d</code> · Nginx + Let\'s Encrypt · next-pwa'],
  ], note:'<b>Nguyên tắc:</b> mỗi app có owner riêng; dữ liệu chung qua DataStore + appId.'},
  {k:'apps', title:'3 · 14 app (5 nhóm)', icon:'▦', isApps:true, apps:[
    ['📊 Bàn làm việc','Dashboard KPI','finance'],['💰 Tài chính','Sapo2Misa 63 cột — 1/14','finance'],
    ['🛒 Mua hàng','So giá + VietQR','sales'],['📦 Bán hàng','Giá theo khách','sales'],
    ['🤝 CRM','KH/NCC · RFM','sales'],['🏬 Kho','Q7/Q12 · Nhập/Xuất','ops'],
    ['🚚 Giao vận','Xe & tuyến','ops'],['🏷️ Tài sản','Phương tiện','ops'],
    ['👥 Nhân sự-Lương','Chấm công GPS','office'],['💬 Hỗ trợ/CSKH','Ticket','office'],
    ['🛍️ POS','Bán lẻ quầy','sales'],['✅ Quy trình/Lịch','SKTask · SKCalendar','office'],
    ['📁 Văn thư','SKContract','office'],['🖼️ Thư viện','Ảnh/video/content','office'],
  ], note:'<b>Ranh giới Sapo2Misa:</b> chỉ là 1 app Tài chính (stepper 4 bước, ledger chống trùng).'},
  {k:'out', title:'4 · Đích & Liên kết ngoài', icon:'⬔', accent:'border-l-emerald-500', nodes:[
    ['📤 MISA AMIS / Hóa đơn','Excel 63 cột / API · meInvoice phát hành'],
    ['📊 Báo cáo & Đối soát','Dòng tiền · công nợ · tồn · đối soát bank'],
    ['☁️ Google & Ngoài hệ','Drive/Calendar sync · Gmail · file share'],
    ['⚙️ Hệ thống','Backup Postgres · integration_logs · audit log'],
  ], note:'<b>Cách đọc:</b> trái → phải là dòng dữ liệu; Shell ở giữa điều phối.'},
];

function setMU(m){
  document.documentElement.setAttribute('data-mu',m);
  try{localStorage.setItem('sk-mu',m);}catch(e){}
  syncThemeMeta(m);
  const isLight=m==='light';
  document.getElementById('btnLight').setAttribute('aria-pressed', isLight?'true':'false');
  document.getElementById('btnDark').setAttribute('aria-pressed', !isLight?'true':'false');
  document.getElementById('btnLight').className=isLight?'px-4 py-2 rounded-full text-xs font-extrabold tracking-wide border bg-white text-slate-900 border-slate-200 shadow':'px-4 py-2 rounded-full text-xs font-extrabold tracking-wide border bg-white/10 text-white border-white/15';
  document.getElementById('btnDark').className=!isLight?'px-4 py-2 rounded-full text-xs font-extrabold tracking-wide border bg-slate-900 text-white border-slate-800 shadow':'px-4 py-2 rounded-full text-xs font-extrabold tracking-wide border bg-white/10 text-white border-white/15';
  document.getElementById('frame').style.background='var(--surface)';
  document.getElementById('frame').style.borderColor='var(--line)';
  document.getElementById('topbar').style.background='var(--surface)';
  document.getElementById('topbar').style.borderColor='var(--line)';
  document.getElementById('canvas').style.background='var(--bg)';
  document.getElementById('foot').style.background='var(--surface)';
  document.getElementById('foot').style.borderColor='var(--line)';
  document.getElementById('topLogo').style.borderColor='var(--line)';
  if(isLight){
    document.getElementById('topTitle').innerHTML='SK Workspace — Sơ đồ tư duy <span class="mono text-[11px] px-2 py-0.5 rounded-full bg-[#0B1329] text-white">MODERN UTILITY</span>';
    document.getElementById('topTitle').style.color='var(--ink)';
    document.getElementById('topSub').textContent='Nguồn → Core Shell → 14 app → Đích · 1 hình duy nhất để hiểu toàn hệ thống';
    document.getElementById('topSub').style.color='var(--muted)';
    document.getElementById('pillArea').innerHTML='<span class="mono text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 border border-amber-200 font-bold">Data Hub</span><span class="mono text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 font-bold">14 app</span>';
    document.getElementById('h2').innerHTML='<span class="w-7 h-7 rounded-lg border inline-grid place-items-center" style="background:var(--surface);border-color:var(--line)">▦</span> Nguồn dữ liệu → Shell → App nghiệp vụ → Đích & liên kết ngoài';
    document.getElementById('h2').style.color='var(--ink)';
    document.getElementById('desc').innerHTML='Một hình duy nhất để hiểu toàn hệ thống: <b>SK Workspace là Data Hub</b> (Sapo API + nhập tay → DataStore truth → MISA 63 cột / HĐĐT / Thuế). Sapo2Misa chỉ là <b>1 trong 14</b> ô trong nhóm Tài chính. Shell duy nhất (WorkspaceRoot + HomePage + appRegistry + RBAC + Workflow Engine) điều hướng bằng <code style="background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:6px">#home → #app/* → #settings</code>.';
    document.getElementById('foot').innerHTML='<span>SK Workspace · Modern Utility Light · #EBF3FA</span><span class="mono">5 cột · Sapo ↔ Hub ↔ MISA · In A3</span>';
    document.getElementById('foot').style.color='#64748B';
  } else {
    document.getElementById('topTitle').innerHTML='SK Workspace — Mindmap Cockpit <span class="mono text-[11px] px-2 py-0.5 rounded-full border" style="background:rgba(255,255,255,.08);border-color:var(--line);color:#a5f3fc">DARK</span>';
    document.getElementById('topTitle').style.color='var(--ink)';
    document.getElementById('topSub').textContent='Dòng dữ liệu trái → phải · Shell điều phối · 14 app là nơi làm việc';
    document.getElementById('topSub').style.color='var(--muted)';
    document.getElementById('pillArea').innerHTML='<span class="mono text-xs px-2.5 py-1 rounded-full font-bold" style="background:rgba(255,255,255,.08);border:1px solid var(--line);color:#a5f3fc">LIVE</span><span class="mono text-xs px-2.5 py-1 rounded-full font-bold" style="background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#6ee7b7">Cockpit</span>';
    document.getElementById('h2').innerHTML='<span class="w-7 h-7 rounded-lg border inline-grid place-items-center" style="background:rgba(255,255,255,.06);border-color:var(--line)">⬢</span> Nguồn dữ liệu → Shell → App nghiệp vụ → Đích';
    document.getElementById('h2').style.color='var(--ink)';
    document.getElementById('desc').innerHTML='<span style="color:var(--muted)">Một hình duy nhất để hiểu toàn hệ thống: <b style="color:var(--ink)">SK Workspace là Data Hub</b> — Sapo API + nhập tay → DataStore truth → MISA 63 cột / HĐĐT / Thuế. Sapo2Misa chỉ là <b style="color:var(--ink)">1 trong 14</b> trong nhóm Tài chính.</span>';
    document.getElementById('foot').innerHTML='<span class="text-white/60">Dark Cockpit · Flow 5 cột</span><span class="mono text-cyan-300">Sapo → Hub → MISA 63 cột</span>';
    document.getElementById('foot').style.color='rgba(255,255,255,.6)';
  }
  render();
}
function render(){
  const flow=document.getElementById('flow');
  flow.innerHTML = cols.map(c=>{
    let body='';
    if(c.isApps){
      const map={finance:'border-l-amber-500', sales:'border-l-sky-500', ops:'border-l-emerald-500', office:'border-l-red-500'};
      body=`<div class="grid grid-cols-2 gap-2">${c.apps.map(a=>`
        <div class="rounded-lg border p-2.5 border-l-4 ${map[a[2]]}" style="background:var(--surface);border-color:var(--line)">
          <div class="text-xs font-bold">${a[0]}</div>
          <div class="mono text-[11px] opacity-60">${a[1]}</div>
        </div>
      `).join('')}</div>`;
    } else {
      body=c.nodes.map(n=>`
        <div class="rounded-lg border p-2.5 border-l-4 ${c.accent}" style="background:var(--surface);border-color:var(--line)">
          <div class="text-xs font-bold">${n[0]}</div>
          <div class="mono text-[11px] opacity-60">${n[1]}</div>
        </div>
      `).join('');
    }
    return `<div class="rounded-xl border p-3 flex flex-col gap-2" style="background:var(--surface);border-color:var(--line)">
      <div class="mono text-[11px] tracking-widest font-extrabold flex items-center gap-2 opacity-60">
        <span class="w-6 h-6 rounded-full grid place-items-center border text-[11px]" style="background:var(--bg);border-color:var(--line)">${c.icon}</span> ${c.title}
      </div>
      ${body}
      <div class="rounded-lg border p-2.5 mono text-[11px] leading-relaxed opacity-70" style="background:var(--bg);border-color:var(--line);border-style:dashed">${c.note}</div>
    </div>`;
  }).join('');

  document.getElementById('legend').innerHTML=`
    <span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full bg-sky-500 inline-block"></i> Nguồn</span>
    <span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full bg-violet-500 inline-block"></i> Core Shell</span>
    <span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full bg-amber-500 inline-block"></i> App</span>
    <span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></i> Đích</span>
  `;
  document.getElementById('legend').style.color='var(--muted)';
  document.getElementById('footGrid').innerHTML=`
    <div class="rounded-xl border p-3" style="background:var(--surface);border-color:var(--line)">
      <div class="text-xs font-extrabold">🧭 Luồng điều hướng (Hash Router)</div>
      <ul class="mono text-[11px] mt-2 space-y-1 list-disc pl-4 opacity-70">
        <li><code class="px-1.5 py-0.5 rounded border" style="background:var(--bg);border-color:var(--line)">#home</code> (5×3) → <code class="px-1.5 py-0.5 rounded border" style="background:var(--bg);border-color:var(--line)">#app/sapo2misa</code> → <code class="px-1.5 py-0.5 rounded border" style="background:var(--bg);border-color:var(--line)">#settings</code></li>
        <li>RBAC <code class="px-1.5 py-0.5 rounded border" style="background:var(--bg);border-color:var(--line)">hasAppAccess(appId)</code> chặn app chưa cấp quyền.</li>
      </ul>
    </div>
    <div class="rounded-xl border p-3" style="background:var(--surface);border-color:var(--line)">
      <div class="text-xs font-extrabold">🔐 Đăng nhập nhanh Google</div>
      <ul class="mono text-[11px] mt-2 space-y-1 list-disc pl-4 opacity-70">
        <li>Auth.js provider Google → <code class="px-1.5 py-0.5 rounded border" style="background:var(--bg);border-color:var(--line)">/api/auth/callback/google</code></li>
        <li>Allowlist <b>sonkhang.vn</b> hoặc invite → JWT session · OTP fallback</li>
      </ul>
    </div>
  `;
}
var initMu=document.documentElement.getAttribute('data-mu')||'light';
syncThemeMeta(initMu);
setMU(initMu);
</script>
</body>
</html>
