name: Deploy SK Workspace

on:
  push:
    branches: [main, master]
  schedule:
    # Renew SSL moi ngay 03:30 UTC (~10:30 VN) — chi job cert-renew chay
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chuẩn hóa tên Docker Image sang chữ thường
        run: echo "IMAGE_TAG=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/sk-workspace
            docker compose pull app
            docker compose up -d --remove-orphans
            docker compose exec -T app npx prisma db push --skip-generate || true
            # Thu renew chung chi SSL (khong fail deploy neu chua co cert)
            docker compose --profile certbot run --rm certbot renew --quiet 2>/dev/null || true
            docker compose exec -T nginx nginx -s reload 2>/dev/null || true
            docker system prune -f

  # Dinh ky renew SSL — chay 03:30 hang ngay (UTC ~10:30 VN)
  cert-renew:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/sk-workspace
            docker compose --profile certbot run --rm certbot renew --quiet || true
            docker compose exec -T nginx nginx -s reload 2>/dev/null || true
