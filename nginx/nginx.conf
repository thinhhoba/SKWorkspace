worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on; gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
  gzip_vary on; gzip_min_length 1024;
  client_max_body_size 50M;
  upstream app_upstream { server app:3000; }
  server {
    listen 80;
    server_name _;
    location / { proxy_pass http://app_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /sw.js { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.json { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location /_next/static/ { proxy_pass http://app_upstream; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  }
  # HTTPS server sẽ được certbot/Let's Encrypt bổ sung; giữ http làm fallback
}
