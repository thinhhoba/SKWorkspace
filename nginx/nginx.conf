worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on; gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
  gzip_vary on; gzip_min_length 1024;
  client_max_body_size 50M;

  # Rate limiting & Security Headers (CWE-307, CWE-693)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_status 429;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  upstream app_upstream { server app:3000; }

  # ============================================================
  # HTTP 80 — 3 subdomain + ACME challenge cho Certbot
  # Sau khi chay certbot --nginx hoac --webroot, certbot se tu
  # dong chen them cac server block listen 443 ssl + redirect.
  # Xem huong dan trong scripts/setup-vps.sh
  # ============================================================

  # 1) workspace.sonkhang.vn — app chinh (mac dinh)
  server {
    listen 80;
    server_name workspace.sonkhang.vn;

    # Certbot webroot — phuc vu file challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location = /api/auth/login {
      limit_req zone=auth_limit burst=3 nodelay;
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sw.js { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.json { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location /_next/static/ { proxy_pass http://app_upstream; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  }

  # 2) pos.sonkhang.vn — POS ban hang tai quay
  server {
    listen 80;
    server_name pos.sonkhang.vn;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Danh dau kenh POS de app phan biet logic
      proxy_set_header X-Channel pos;
    }
    location = /sw.js { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.json { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location /_next/static/ { proxy_pass http://app_upstream; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  }

  # 3) dathang.sonkhang.vn — Web dat hang B2B
  server {
    listen 80;
    server_name dathang.sonkhang.vn;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Danh dau kenh web_order de app phan biet logic
      proxy_set_header X-Channel web_order;
    }
    location = /sw.js { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.json { proxy_pass http://app_upstream; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location /_next/static/ { proxy_pass http://app_upstream; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  }

  # --- HTTPS 443 ---
  # Chay lenh certbot sau (xem scripts/setup-vps.sh):
  #   sudo certbot --nginx -d workspace.sonkhang.vn -d pos.sonkhang.vn -d dathang.sonkhang.vn
  # hoac webroot:
  #   sudo certbot certonly --webroot -w /var/www/certbot \
  #     -d workspace.sonkhang.vn -d pos.sonkhang.vn -d dathang.sonkhang.vn
  # Certbot se tu dong tao/cap nhat cac block listen 443 ssl ben duoi.
  # Neu dung docker certbot service, thay /var/www/certbot bang volume certbot_www.
}
